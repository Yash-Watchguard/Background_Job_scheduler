AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: BG Job Lambda Worker (Email Scheduler)

Parameters:
  JobTableName:
    Type: String
    Description: DynamoDB Job table name

  LogBucketName:
    Type: String
    Description: S3 bucket for execution logs

  QueueArn:
    Type: String
    Description: ARN of existing SQS queue
  
  DlqArn:
    Type: String
    Description: ARN of DLQ SQS queue

Resources:

  BgJobWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bg-job-worker
      Runtime: python3.10
      Handler: handler.handler
      CodeUri: lambda_worker
      Timeout: 300
      MemorySize: 512

      Events:
        SQSTrigger:
          Type: SQS
          Properties:
            Queue: !Ref QueueArn
            BatchSize: 10
            Enabled: true

      Policies:
        - AWSLambdaBasicExecutionRole

        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:ExecuteStatement
              Resource:
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${JobTableName}

        - Statement:
            - Effect: Allow
              Action:
                - sqs:ReceiveMessage
                - sqs:DeleteMessage
                - sqs:GetQueueAttributes
              Resource: !Ref QueueArn

        - Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource: !Sub arn:aws:s3:::${LogBucketName}/*

        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: "*"

  BgJobDlqHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bg-job-dlq-handler
      Runtime: python3.10
      Handler: handler.handler
      CodeUri: lambda_dlq_handler
      Timeout: 30
      MemorySize: 256

      Events:
        DlqSQSTrigger:
          Type: SQS
          Properties:
            Queue: !Ref DlqArn
            BatchSize: 10
            Enabled: true

      Policies:
        - AWSLambdaBasicExecutionRole

        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
                - dynamodb:ExecuteStatement
              Resource:
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${JobTableName}

Outputs:
  WorkerLambdaArn:
    Description: BG Job Worker Lambda ARN
    Value: !GetAtt BgJobWorkerFunction.Arn
